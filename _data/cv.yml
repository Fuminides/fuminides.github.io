- title: Research Profile
  contents: >
    Marie Skłodowska-Curie co-funded research fellow and PhD in Artificial Intelligence. I develop
    interpretable, uncertainty-aware machine learning methods and evaluate when models can make
    reliable predictions. I lead projects from research question and experiments to publications and
    maintained open-source software.

- title: Research Experience
  type: time_table
  contents:
    - title: YUFE4Postdocs Research Fellow
      institution: University of Essex, UK
      year: 2024 - now
      description:
        - Lead an independent EU-funded programme on interpretable models and reliable classification in resource-constrained settings.
        - Developed HyperDFS for dynamic feature selection, accepted as a NeurIPS 2026 poster.
        - Study uncertainty-aware classification with conformal prediction and interval-valued models, including when a system should abstain or request more information.
        - Created and maintain <a href="/software/">Ex-Fuzzy</a>, an open-source Python framework for explainable and neurosymbolic learning used by independent research groups.
    - title: Visiting Researcher
      institution: University of Essex, UK
      year: 2022 - 2023
      description:
        - Built the first version of Ex-Fuzzy with researchers at Essex and Navarre, and analysed deep image representations in work published in IEEE Transactions on Fuzzy Systems.
    - title: Junior Researcher
      institution: Public University of Navarre, Spain
      year: 2018 - 2019
      description:
        - Developed and evaluated clustering methods for tabular data, published in Information Sciences.
    - title: AI Intern
      institution: Iternova, Spain
      year: 2016
      description:
        - Built the company's first neural-network-based NLP system, which let clients access its services through a Telegram chatbot.

